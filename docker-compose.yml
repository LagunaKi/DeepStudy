services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-deepstudy-dev-only}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-deepstudy-dev-only}' 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gemini-3-flash-preview}"
      LLM_CODER_MODEL: "${LLM_CODER_MODEL:-gemini-3-flash-preview}"
      GEMINI_THINKING_LEVEL: "${GEMINI_THINKING_LEVEL:-medium}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-deepstudy-dev-only}"
      SQLITE_DB_PATH: "/data/deepstudy.db"
      VECTOR_STORE_PATH: "/data/vector_store"
      CORS_ORIGINS: '["http://localhost:7860"]'
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    ports:
      - "7860:7860"
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7860/health"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  neo4j_data:
  neo4j_logs:
