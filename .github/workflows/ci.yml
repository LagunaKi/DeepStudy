name: CI

on:
  push:
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install unit-test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend unit tests
        run: python -m pytest -q
      - name: Compile backend sources
        run: python -m compileall -q backend
      - name: Reject committed API tokens
        run: |
          if git grep -nE '(ms-[A-Za-z0-9-]{20,}|sk-[A-Za-z0-9_-]{20,})' -- ':!*.lock'; then
            echo "Potential API token detected in tracked files."
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
